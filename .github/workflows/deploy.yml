name: Deployment

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed

permissions:
  actions: read
  contents: read

# Only one deployment may run at a time.
# If a new push lands while a deploy is in progress, the in-progress deploy
# finishes first; the new one queues and runs afterward.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production (Self-hosted)
    runs-on: self-hosted

    # Only deploy when CI passed on main, not on PRs or failed CI runs.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    environment: production

    env:
      DEPLOY_BASE: /var/www/opticore
      APP_URL: https://opticoresolutionsltd.com

    steps:
      # -----------------------------------------------------------------
      # 1. Fetch source at the exact SHA that passed CI.
      # -----------------------------------------------------------------
      - name: Checkout source at CI commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: _checkout

      # -----------------------------------------------------------------
      # 2. Download the frontend artifact verified by CI.
      #    Production runs the exact same compiled assets that passed all
      #    lint, type-check, and bundle-budget checks in CI.
      # -----------------------------------------------------------------
      - name: Download verified frontend build from CI
        uses: actions/download-artifact@v8
        with:
          name: frontend-build-${{ github.event.workflow_run.head_sha }}
          path: _frontend_build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # -----------------------------------------------------------------
      # 3. Derive a deterministic release name: timestamp + short SHA.
      # -----------------------------------------------------------------
      - name: Set release name
        id: release
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          RELEASE_NAME="$(date -u '+%Y%m%d_%H%M%S')_${SHORT_SHA}"
          echo "name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------
      # 4. Export paths consumed by deploy.sh.
      #    Source population (rsync) is handled inside deploy.sh so that
      #    all deployment logic lives in one place and the exclusion list
      #    (storage/, .env, node_modules/, public/build/, public/hot) is
      #    version-controlled alongside the rest of the deploy script.
      # -----------------------------------------------------------------
      - name: Set deployment paths
        run: |
          echo "DEPLOY_SOURCE_DIR=$(pwd)/_checkout" >> "$GITHUB_ENV"
          echo "FRONTEND_BUILD_DIR=$(pwd)/_frontend_build" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------
      # 5. Run the atomic deployment script. It:
      #      - Rsyncs the verified source checkout into the release dir
      #      - Links shared .env and storage
      #      - Installs Composer deps (--no-dev)
      #      - Places the pre-built frontend
      #      - Enables maintenance mode
      #      - Runs migrations (both DB connections)
      #      - Caches config, routes, views, events
      #      - Atomically swaps the symlink
      #      - Disables maintenance mode
      #      - Restarts PHP-FPM, Reverb, signals queue:restart
      #      - Runs a health check against /up
      #      - Auto-rolls back on any failure after the symlink swap
      #      - Cleans up old releases (keeps last 5)
      #
      # Called from _checkout/ — deploy.sh itself populates the release
      # directory, so it cannot be called from that directory yet.
      # -----------------------------------------------------------------
      - name: Run atomic deployment
        run: |
          chmod +x "_checkout/scripts/deploy/deploy.sh"
          bash "_checkout/scripts/deploy/deploy.sh" \
            "${{ steps.release.outputs.name }}" \
            "${{ steps.release.outputs.sha }}"
        env:
          DEPLOY_SOURCE_DIR: ${{ env.DEPLOY_SOURCE_DIR }}
          FRONTEND_BUILD_DIR: ${{ env.FRONTEND_BUILD_DIR }}

      # -----------------------------------------------------------------
      # 6. Clean up the workspace regardless of outcome.
      # -----------------------------------------------------------------
      - name: Clean up workspace
        if: always()
        run: rm -rf _checkout _frontend_build

      # -----------------------------------------------------------------
      # 7. GitHub Actions UI summary for quick reference.
      # -----------------------------------------------------------------
      - name: Write deployment summary
        if: success()
        run: |
          {
            echo "## Deployment Successful"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Release | \`${{ steps.release.outputs.name }}\` |"
            echo "| Commit | \`${{ steps.release.outputs.sha }}\` |"
            echo "| Deployed at | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"
            echo "| App URL | ${{ env.APP_URL }} |"
            echo ""
            echo "### Recent releases on VPS"
            echo '```'
            ls -dt "${DEPLOY_BASE}/releases"/* 2>/dev/null | head -5 | while read -r dir; do
              name=$(basename "$dir")
              marker=""
              [ "$(readlink "${DEPLOY_BASE}/current")" = "$dir" ] && marker=" ← current"
              echo "$name$marker"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write failure summary
        if: failure()
        run: |
          {
            echo "## Deployment FAILED — rollback was attempted"
            echo ""
            echo "- Release: \`${{ steps.release.outputs.name }}\`"
            echo "- Commit: \`${{ steps.release.outputs.sha }}\`"
            echo ""
            echo "Check the VPS deploy log:"
            echo "\`\`\`"
            echo "cat ${DEPLOY_BASE}/DEPLOY_LOG"
            echo "\`\`\`"
            echo ""
            echo "To manually roll back, trigger the **Rollback** workflow."
          } >> "$GITHUB_STEP_SUMMARY"
