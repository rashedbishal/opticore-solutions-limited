# CI Pipeline — Laravel + Inertia + React
# Fast CI: SQLite (in-memory style). No DB service needed.
# Runs on every push and PR to main. Fails fast on any error.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test (SQLite)
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install PHP 8.3
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, ctype, fileinfo, json, tokenizer, xml
          coverage: none

      # 3. Install Node 22
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 4. Cache Composer packages
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # 5. Install PHP dependencies
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # 6. Install Node dependencies
      - name: Install Node dependencies
        run: npm ci

      # 7. PHP Linting (Pint)
      - name: Run Pint (PHP Lint)
        run: ./vendor/bin/pint --test

      # 8. JS/TS Linting (ESLint)
      - name: Run ESLint
        run: npm run lint:check

      # 9. Prettier Check
      - name: Run Prettier check
        run: npm run format:check

      # 10. Prepare Laravel environment
      #     Tests override DB settings via phpunit.xml (SQLite).
      #     We only need a valid APP_KEY and sane defaults for pre-test steps.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=true/' .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=database\/testing.sqlite/' .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=array/' .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          touch database/testing.sqlite database/testing_admin.sqlite

      # 11. Generate Wayfinder Routes & Types
      - name: Generate Wayfinder Routes
        run: php artisan wayfinder:generate

      # 12. TypeScript Check
      - name: Run Type Check
        run: npm run types:check

      # 13. Build frontend assets
      - name: Build frontend
        run: npm run build

      # 14. Bundle budget regression gate
      - name: Check bundle budgets
        run: npm run perf:bundle-check

      # 15. Run Pest tests (phpunit.xml → SQLite, RefreshDatabase handles migrations)
      - name: Run tests
        run: ./vendor/bin/pest --ci
