# CI Pipeline — Laravel + Inertia + React
# Runs on every push and PR to main. Fails fast on any error.


name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install PHP 8.3
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, json, tokenizer, xml
          coverage: none

      # 3. Install Node 22
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 4. Cache Composer packages
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # 5. Install PHP dependencies
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # 6. Install Node dependencies
      - name: Install Node dependencies
        run: npm ci

      # 7. PHP Linting (Pint)
      - name: Run Pint (PHP Lint)
        run: ./vendor/bin/pint --test

      # 8. JS/TS Linting (ESLint)
      - name: Run ESLint
        run: npm run lint:check

      # 9. Prettier Check
      - name: Run Prettier check
        run: npm run format:check

      # 10. TypeScript Check
      - name: Run Type Check
        run: npm run types:check

      # 11. Prepare Laravel environment for testing
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # 12. Setup SQLite for testing
      - name: Setup SQLite database
        run: |
          touch database/database.sqlite
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's|# DB_DATABASE=.*|DB_DATABASE=database/database.sqlite|' .env
          sed -i 's/CACHE_STORE=.*/CACHE_STORE=file/' .env
          sed -i 's/SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
          sed -i 's/QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env

      # 13. Run migrations
      - name: Run migrations
        run: php artisan migrate --force

      # 14. Build frontend assets
      - name: Build frontend
        run: npm run build

      # 15. Run Pest tests
      - name: Run tests
        run: ./vendor/bin/pest --ci
